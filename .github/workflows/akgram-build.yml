name: Build Akgram APK

on:
  push:
    branches: [ akgram-build ]
    paths:
      - 'akgram/**'
      - '.github/workflows/akgram-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Android SDK 29
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;29.0.3" || true
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew -p akgram clean assembleDebug --stacktrace
      - name: Rename APK
        run: cp akgram/app/build/outputs/apk/debug/app-debug.apk akgram/Akgram-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Akgram-APK
          path: akgram/Akgram-v1.0.0.apk
          if-no-files-found: error
